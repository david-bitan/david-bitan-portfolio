<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facet · drop a bank statement, see where your money goes</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23C5F06A'/%3E%3Cpath d='M9 22V14M16 22V9M23 22v-5' stroke='%230D0E10' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="description" content="Facet reads a bank statement (Excel, CSV, PDF, Word) in your browser and builds a full analysis of your spending. A portfolio concept by David Bitan.">
<meta name="robots" content="noindex">
<script>try { const t = JSON.parse(localStorage.getItem("facet-theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root, [data-theme="dark"] {
	--bg: #0D0E10; --side: #111215; --surface: #17191C; --surface-2: #1F2125; --hover: #23262B; --line: #272A2F; --line-2: #383C43;
	--ink: #EEEFF1; --ink-2: #B3B7BE; --ink-3: #8A8F98;
	--accent: #C5F06A; --accent-hover: #D4F78A; --on-accent: #0D0E10; --accent-text: #C5F06A; --accent-soft: rgba(197, 240, 106, .1);
	--focus: #5B9BEA; --ok: #4CC38A; --ok-soft: rgba(76, 195, 138, .12); --warn: #F0B44C; --warn-soft: rgba(240, 180, 76, .12);
	--tip: #EEEFF1; --tip-ink: #0D0E10; --shadow: 0 20px 50px rgba(0, 0, 0, .5);
	color-scheme: dark;
}
[data-theme="light"] {
	--bg: #F3F4F1; --side: #FFFFFF; --surface: #FFFFFF; --surface-2: #F1F2EF; --hover: #ECEDE9; --line: #E1E3DE; --line-2: #CACDC6;
	--ink: #121314; --ink-2: #4A4D52; --ink-3: #6C7077;
	--accent: #ADDE56; --accent-hover: #9FD246; --on-accent: #0D0E10; --accent-text: #121314; --accent-soft: #EDF7DD; --accent-title: #A2D54C; /* light theme titles: option 4, a trial chosen by David (contrast 1.6 : 1, below the 3 : 1 minimum) */ /* light theme: a lime between the dark theme's and a readable green; small text stays ink */
	--focus: #2F6FB5; --ok: #187A4F; --ok-soft: #E4F3EB; --warn: #8A5300; --warn-soft: #FBEFD9;
	--tip: #121314; --tip-ink: #FFFFFF; --shadow: 0 20px 50px rgba(0, 0, 0, .14);
	color-scheme: light;
}
:root {
	--sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
	--r-xl: 20px; --r-lg: 12px; --r-md: 8px; --r-sm: 4px; /* concentric: 20 = 12 + 8, 12 = 8 + 4 */
	--open: cubic-bezier(0.22, 0.61, 0.36, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html[lang="he"] { --sans: "Heebo", ui-sans-serif, system-ui, Arial, sans-serif; }
[dir="rtl"] .flip-ic { transform: scaleX(-1); }
.plot svg, .art { direction: ltr; } /* charts read left to right in every language, like a timeline */
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15.5px/1.55 var(--sans); }
button, a, [role="button"], [role="option"], [role="tab"], label.drop { cursor: pointer; }
button { font: inherit; color: inherit; }
a { color: var(--accent-text); text-underline-offset: 3px; }
input { font: inherit; color: inherit; }
.i { width: 18px; height: 18px; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p, li, small, td { text-wrap: pretty; }
.num { font-variant-numeric: tabular-nums; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-lg); border: 1px solid var(--line-2); background: var(--surface); font-size: 14.5px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--hover); }
.btn .i { width: 17px; height: 17px; }
.btn-p { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn-p:hover { background: var(--accent-hover); }
.btn-g { border-color: transparent; background: none; }
.btn-g:hover { background: var(--hover); }
.btn-sm { height: 34px; padding: 0 12px; font-size: 14px; border-radius: var(--r-md); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: var(--r-lg); border: 0; background: none; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }

/* logo */
.logo { display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; color: var(--ink); text-decoration: none; }
.logo .mk { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex: none; }
.logo .mk svg { width: 18px; height: 18px; }
.logo b { font: 700 20px/1 var(--sans); letter-spacing: -.02em; }

/* ---------- public pages (landing, sign in) ---------- */
.site-top { width: 100%; max-width: 1200px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; gap: 8px; }
.site-top .sp { flex: 1; }
.land { width: 100%; max-width: 1200px; margin: 0 auto; padding: 48px 24px 0; }
.site { min-height: 100vh; display: flex; flex-direction: column; }
.site .foot { margin-top: auto; }
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; align-items: center; }
.art { position: relative; height: 360px; }
.art-doc { position: absolute; left: 0; top: 10px; width: 68%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 20px; box-shadow: var(--shadow); transform: rotate(-3deg); }
.art-h { display: flex; gap: 8px; margin-bottom: 16px; } .art-h span { height: 10px; border-radius: 5px; background: var(--line-2); width: 40%; } .art-h span + span { width: 20%; }
.art-r { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); animation: rise 600ms var(--open) both; }
.art-r i { width: 10px; height: 10px; border-radius: 3px; } .art-r b { height: 8px; border-radius: 4px; background: var(--surface-2); display: block; }
.art-r em { font: 500 12.5px var(--mono); font-style: normal; color: var(--ink-2); } .art-r em.in { color: var(--ok); }
.art-out { position: absolute; right: 0; bottom: 0; width: 62%; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-xl); padding: 20px; box-shadow: var(--shadow); display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: end; animation: rise 700ms var(--open) 900ms both; }
.art-dn path { animation: pop 700ms var(--open) both; transform-origin: 70px 70px; } .art-bars rect { animation: grow 700ms var(--open) both; transform-box: fill-box; transform-origin: bottom; }
.art-dn, .art-bars { width: 100%; height: auto; display: block; }
@media (max-width: 1100px) { .hero { grid-template-columns: 1fr; } .art { display: none; } }
.land h1 { font: 700 clamp(36px, 6vw, 68px)/1.02 var(--sans); letter-spacing: -.04em; max-width: 900px; }
.land h1 em { font-style: normal; color: var(--accent-text); display: block; text-wrap: balance; } /* "See where your money goes." on its own two balanced lines */
[data-theme="light"] .land h1 em { color: var(--accent-title); }
.land .lede { font-size: clamp(17px, 2vw, 20px); color: var(--ink-2); max-width: 660px; margin: 20px 0 0; }
.land .cta { display: flex; gap: 10px; flex-wrap: wrap; margin: 32px 0 0; }
.land .cta .btn { height: 48px; padding: 0 22px; font-size: 15.5px; }
/* supported formats: plain caption text with icons and separators, nothing that looks like a button */
.formats { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0; margin: 28px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--ink-3); }
.formats .lead { color: var(--ink-3); margin-inline-end: 10px; }
.formats li:not(.lead) { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.formats li:not(.lead):not(:last-child)::after { content: ""; width: 3px; height: 3px; border-radius: 50%; background: var(--line-2); margin: 0 12px; }
.formats .i { width: 15px; height: 15px; color: var(--ink-3); }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 64px 0 0; padding: 0; list-style: none; counter-reset: s; }
.how li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 24px; counter-increment: s; }
.how li::before { content: counter(s); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font: 600 14px var(--mono); margin-bottom: 18px; }
.how h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.how p { margin: 0; color: var(--ink-2); font-size: 15px; }
.trust { display: flex; gap: 14px; align-items: flex-start; margin: 16px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 20px 24px; }
.trust .i { color: var(--ok); margin-top: 3px; }
.trust p { margin: 0; color: var(--ink-2); font-size: 15px; }
.trust b { color: var(--ink); font-weight: 600; }

.auth-card { position: relative; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-xl); padding: 8px 8px 16px; box-shadow: var(--shadow); min-width: 0; }
.ov-x { position: absolute; top: 8px; inset-inline-end: 8px; width: 40px; height: 40px; z-index: 2; } /* 12 + 8 = 20: concentric with the card */
.auth-card .tabs { margin-inline-end: 48px; }
/* overlay: dimmed, blurred page behind; the panel rises in (500 ms) and drops out (400 ms) */
.ov { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.ov-bg { position: fixed; inset: 0; background: rgba(8, 9, 11, .55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity 500ms var(--open); }
[data-theme="light"] .ov-bg { background: rgba(20, 22, 26, .3); }
.ov-box { position: relative; width: 100%; max-width: 400px; opacity: 0; transform: translateY(16px) scale(.98); transition: opacity 500ms var(--open), transform 500ms var(--open); }
.ov.on .ov-bg, .ov.on .ov-box { opacity: 1; transform: none; }
.ov.off .ov-bg, .ov.off .ov-box { transition-duration: 400ms; }
.auth-body { position: relative; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); border-radius: var(--r-lg); padding: 4px; position: relative; }
.tabs button { border: 0; background: none; height: 36px; border-radius: var(--r-md); font-weight: 500; color: var(--ink-2); position: relative; z-index: 1; transition: color .3s; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs .pill { position: absolute; top: 4px; bottom: 4px; inset-inline-start: 4px; width: calc(50% - 6px); border-radius: var(--r-md); background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform 500ms var(--open); }
.tabs[data-on="up"] .pill { transform: translateX(calc(100% + 4px)); }
.auth-card form { padding: 16px 12px 0; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.auth-card form > *, .field input { min-width: 0; }
.auth-card h2 { font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
.auth-card .sub { margin: -6px 0 4px; color: var(--ink-2); font-size: 14.5px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13.5px; font-weight: 500; }
.field .in { position: relative; }
.field input { width: 100%; height: 40px; border-radius: var(--r-lg); border: 1px solid var(--line-2); background: var(--bg); padding: 0 14px; font-size: 15.5px; outline: 0; transition: border-color .15s, box-shadow .15s; }
.field input:focus { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.field input[aria-invalid="true"] { border-color: var(--warn); }
.field .eye { position: absolute; inset-inline-end: 2px; top: 2px; width: 36px; height: 36px; }
.field .err { color: var(--warn); font-size: 13.5px; margin: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.auth-card .btn { white-space: normal; height: auto; min-height: 40px; padding-top: 10px; padding-bottom: 10px; text-align: center; line-height: 1.3; }
.auth-card .btn-p { min-height: 42px; width: 100%; margin-top: 4px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.demo-note { display: flex; gap: 8px; color: var(--ink-3); font-size: 12.5px; margin: 12px 12px 0; }
.demo-note .i { width: 16px; height: 16px; margin-top: 2px; }

/* ---------- app shell ---------- */
.shell { display: grid; grid-template-columns: 256px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px 36px; /* 24 px more space under New analysis, away from the taskbar */ gap: 6px; }
.side .logo { padding: 0 8px 14px; }
.side .new { margin: 10px 0 0; height: 44px; flex: none; } /* at the bottom of the panel, where the theme and account used to be */
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; height: 40px; padding: 0 12px; border-radius: var(--r-lg); color: var(--ink-2); font-weight: 500; text-align: start; }
.nav button:hover { background: var(--hover); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.nav .count { margin-inline-start: auto; font: 500 12px var(--mono); color: var(--ink-3); }
.recent { list-style: none; margin: 4px 0 0; padding: 0 0 0 12px; display: grid; gap: 1px; }
.recent button { width: 100%; border: 0; background: none; text-align: start; padding: 6px 10px; border-radius: var(--r-md); color: var(--ink-3); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.recent button:hover, .recent button[aria-current="true"] { color: var(--ink); background: var(--hover); }
.recent .all { color: var(--accent-text); font-weight: 500; }
.side .grow { flex: 1; }
/* account button in the top bar (right): avatar + first name, menu opens downward */
.me { position: relative; }
.me-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 8px 4px 4px; border-radius: 999px; color: var(--ink); }
.me-btn:hover, .me-btn[aria-expanded="true"] { background: var(--hover); }
.me-btn .who b { font-size: 14px; font-weight: 600; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.me-btn .chev { width: 15px; height: 15px; color: var(--ink-3); }
.me .menu { min-width: 220px; }
.topbar .icon-btn, .mtop .icon-btn { width: 36px; height: 36px; }
.side-foot { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.theme { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); border-radius: var(--r-lg); padding: 4px; position: relative; }
.theme button { border: 0; background: none; height: 32px; border-radius: var(--r-md); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); position: relative; z-index: 1; }
.theme button[aria-pressed="true"] { color: var(--ink); }
.theme .pill { position: absolute; top: 4px; bottom: 4px; inset-inline-start: 4px; width: calc(50% - 6px); border-radius: var(--r-md); background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform 500ms var(--open); }
[data-theme="light"] .theme .pill { transform: translateX(calc(100% + 4px)); }
[dir="rtl"][data-theme="light"] .theme .pill, [dir="rtl"] .tabs[data-on="up"] .pill { transform: translateX(calc(-100% - 4px)); }
.theme .i { width: 15px; height: 15px; }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font: 600 12.5px var(--sans); flex: none; }
.mtop { display: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 49; opacity: 0; transition: opacity 400ms var(--open); }
.scrim.on { opacity: 1; }

.mainw { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px; padding: 10px 40px; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .sp { flex: 1; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; color: var(--ink-3); }
.crumbs button { border: 0; background: none; padding: 4px 6px; border-radius: var(--r-md); color: var(--ink-3); }
.crumbs button:hover { color: var(--ink); background: var(--hover); }
.crumbs span { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs .i { width: 14px; height: 14px; }
.main { min-width: 0; padding: 28px 40px 32px; width: 100%; flex: 1; display: flex; flex-direction: column; }
.main > .foot { margin-top: auto; }
.main > header h1 { font: 650 clamp(26px, 3vw, 34px)/1.15 var(--sans); letter-spacing: -.025em; }
.main > header p { margin: 8px 0 0; color: var(--ink-2); }

/* menus (custom dropdowns): height 0 to auto + fade, 500 ms open, 400 ms close */
.dd { position: relative; }
.menu { position: absolute; inset-inline-end: 0; top: calc(100% + 6px); z-index: 40; list-style: none; margin: 0; padding: 4px; min-width: 200px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.menu li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-md); font-size: 14.5px; white-space: nowrap; color: var(--ink); }
.menu li .i { width: 16px; height: 16px; color: var(--ink-3); }
.menu li:hover, .menu li:focus { background: var(--hover); outline: none; }
.menu li[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.menu li[aria-selected="true"] .i { color: var(--accent-text); }
.menu li .dot { margin-inline-end: 2px; }
.chev { transition: transform 500ms var(--open); }
[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* ---------- upload ---------- */
.drop { display: grid; place-items: center; text-align: center; gap: 6px; margin: 28px 0 0; padding: 56px 24px; border: 1.5px dashed var(--line-2); border-radius: var(--r-xl); background: var(--surface); transition: border-color .2s, background .2s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .ic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--surface-2); margin-bottom: 10px; }
.drop .ic .i { width: 26px; height: 26px; color: var(--accent-text); }
.drop b { font-size: 19px; font-weight: 600; }
.drop span { color: var(--ink-2); font-size: 14.5px; }
.drop .btn { margin-top: 14px; pointer-events: none; }
.priv { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 0; color: var(--ink-2); font-size: 14px; }
.priv .i { width: 16px; height: 16px; margin-top: 3px; color: var(--ok); }
h2.sec { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.sec-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin: 40px 0 0; }
.sm-in { padding-top: 4px; }
h2.sec.hl { color: var(--accent); } /* dark: lime, like the hero line */
[data-theme="light"] h2.sec.hl { color: var(--accent-title); }
p.sec-sub { margin: 0 0 14px; color: var(--ink-2); font-size: 14.5px; }
.samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(270px, 100%), 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
.samples li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 8px 8px 8px; display: flex; flex-direction: column; }
.samples .sm-b { padding: 12px 12px 14px; flex: 1; }
.samples .ft { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.samples .ft .i { width: 15px; height: 15px; }
.samples h3 { font-size: 16px; font-weight: 600; margin: 8px 0 4px; }
.samples p { margin: 0; color: var(--ink-2); font-size: 14px; }
.samples .acts { display: flex; flex-wrap: wrap; gap: 4px; }
.samples .acts .btn { flex: 1; }

/* reading */
.steps-card { margin: 28px 0 0; max-width: 680px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 8px; }
.prog { height: 6px; border-radius: 999px; background: var(--surface-2); margin: 8px 8px 4px; overflow: hidden; }
.prog span { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width 600ms var(--open); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: var(--r-lg); color: var(--ink-3); transition: color .3s, background .3s; }
.steps li.on { background: var(--accent-soft); color: var(--ink); }
.steps li.done { color: var(--ink); }
.steps .st { width: 26px; height: 26px; flex: none; display: grid; place-items: center; }
.steps .num { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font: 500 12.5px var(--mono); color: var(--ink-3); }
.steps .tick { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; animation: pop 400ms var(--open) both; }
.steps .tick .i { width: 15px; height: 15px; color: var(--on-accent); stroke-width: 3; }
.steps li.on .spin { width: 22px; height: 22px; }
[data-theme="light"] .steps li.on .spin { border-top-color: var(--ink); }
.steps small { display: block; color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }
.spin { width: 18px; height: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--accent); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.alert { display: flex; gap: 12px; align-items: flex-start; margin: 20px 0 0; padding: 16px 18px; border-radius: var(--r-xl); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); max-width: 760px; }
.alert .i { color: var(--warn); margin-top: 2px; }
.alert p { margin: 0 0 4px; }
.alert ul { margin: 6px 0 0; padding-inline-start: 18px; color: var(--ink-2); font-size: 14.5px; }

/* ---------- report ---------- */
.rh { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
.rh > div { flex: 1 1 360px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; color: var(--ink-3); font-size: 14px; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta .i { width: 15px; height: 15px; }
.meta .ok { color: var(--ok); }
.ask { margin: 24px 0 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-xl); padding: 8px; display: flex; align-items: center; gap: 8px; transition: border-color .15s, box-shadow .15s; }
.ask:focus-within { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.ask .lead { display: grid; place-items: center; width: 40px; height: 40px; flex: none; color: var(--accent-text); }
.ask input { flex: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: none; font-size: 16px; }
.ask input::placeholder { color: var(--ink-3); }
.ask .btn-p { height: 44px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
.chips button { text-align: start; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 6px 13px; font-size: 14px; color: var(--ink-2); }
.chips button:hover { border-color: var(--line-2); color: var(--ink); background: var(--surface); }
.views-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 24px 0 0; }
.views-h h2 { font-size: 15px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; font-size: 12.5px; }
.views-h .sp { flex: 1; }
.src-by { font-size: 13px; color: var(--ink-3); display: inline-flex; gap: 6px; align-items: center; }
.src-by .i { width: 14px; height: 14px; }
.src-by.warn { color: var(--warn); }

.sect { margin: 40px 0 0; }
.sect > h2 { font-size: 20px; font-weight: 600; letter-spacing: -.015em; display: flex; align-items: center; gap: 10px; }
.sect > p.sub { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; }
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; margin: 16px 0 0; align-items: stretch; } /* cards side by side share one height: their footers line up */
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 20px; grid-column: span var(--span, 6); min-width: 0; animation: rise 600ms var(--open) both; animation-delay: var(--d, 0ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.card.sel { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.card-h { display: flex; align-items: flex-start; gap: 8px; margin: -12px -12px 10px 0; }
.card-h > .hd { flex: 1; min-width: 0; padding-top: 12px; }
.card h3 { font-size: 15.5px; font-weight: 600; line-height: 1.3; }
.card .per { font-size: 13px; color: var(--ink-3); margin: 2px 0 0; }
.ctl { display: flex; gap: 2px; background: var(--surface-2); border-radius: var(--r-lg); padding: 4px; flex: none; } /* 8 px from the card edge: 12 + 8 = 20 */
.ctl button { border: 0; background: none; width: 30px; height: 30px; border-radius: var(--r-md); display: grid; place-items: center; color: var(--ink-3); }
.ctl button:hover, .ctl button[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
.ctl .i { width: 16px; height: 16px; }
.plot { position: relative; min-height: 30px; }
.big { font: 600 clamp(28px, 3vw, 36px)/1.1 var(--sans); letter-spacing: -.025em; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
.big.pos { color: var(--ok); }
.delta { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; font-size: 13.5px; color: var(--ink-2); flex-wrap: wrap; }
.delta b { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--ink); background: var(--surface-2); border-radius: 999px; padding: 2px 8px; }
.delta b .i { width: 14px; height: 14px; }

/* charts */
.plot svg { display: block; overflow: visible; max-width: 100%; }
line.gl { stroke: var(--line); stroke-width: 1; }
line.base { stroke: var(--line-2); stroke-width: 1; }
text.ax { fill: var(--ink-3); font: 500 11.5px var(--sans); font-variant-numeric: tabular-nums; }
.mk { transition: opacity .2s; }
.mk.dim, .lg li.dim { opacity: .3; }
.mk.part { opacity: .45; }
.plot path.mk:not(.sl) { transform-box: fill-box; transform-origin: bottom; animation: grow 700ms var(--open) both; animation-delay: var(--d, 0ms); }
@keyframes grow { from { transform: scaleY(0); } }
.ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; animation: draw 1100ms var(--open) both; }
.ln-part { fill: none; stroke-width: 2; stroke-dasharray: 4 4; stroke-linecap: round; opacity: .7; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.area { opacity: .1; animation: fade 900ms var(--open) both; }
@keyframes fade { from { opacity: 0; } }
.cross { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
.pt { stroke: var(--surface); stroke-width: 2; pointer-events: none; }
.sl { animation: pop 700ms var(--open) both; animation-delay: var(--d, 0ms); transform-origin: 90px 90px; stroke: var(--surface); stroke-width: 0; }
@keyframes pop { from { opacity: 0; transform: scale(.92) rotate(-8deg); } }
.hit { cursor: pointer; }
.tip { position: absolute; left: 0; top: 0; z-index: 20; pointer-events: none; background: var(--tip); color: var(--tip-ink); border-radius: var(--r-md); padding: 7px 10px; font-size: 13px; line-height: 1.35; opacity: 0; transition: opacity .15s; display: grid; gap: 1px; white-space: nowrap; }
.tip.on { opacity: 1; }
.tip b { font-weight: 500; opacity: .75; }
.tip span { font-weight: 650; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.tip small { opacity: .75; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.hb { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.hb li { display: grid; grid-template-columns: minmax(80px, 36%) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 8px; border-radius: var(--r-md); min-width: 0; }
.hb li:hover { background: var(--hover); }
.hb-l { display: flex; align-items: center; gap: 8px; font-size: 14.5px; min-width: 0; }
.hb-l span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-t { height: 12px; }
.hb-b { display: block; height: 100%; width: var(--w); border-radius: 0 4px 4px 0; transform-origin: left; animation: grow-x 700ms var(--open) both; animation-delay: var(--d, 0ms); min-width: 2px; }
@keyframes grow-x { from { transform: scaleX(0); } }
[dir="rtl"] .hb-b { border-radius: 4px 0 0 4px; transform-origin: right; }
.hb-v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: end; }
.dn { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.dn-c { position: relative; width: 180px; height: 180px; flex: none; margin: 0 auto; }
.dn-t { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dn-t small { font-size: 12.5px; color: var(--ink-3); }
.dn-t b { font: 650 18px/1.2 var(--sans); font-variant-numeric: tabular-nums; }
.lg { list-style: none; margin: 0; padding: 0; flex: 1 1 220px; display: grid; gap: 2px; }
.lg li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto 40px; gap: 10px; align-items: center; padding: 5px 8px; border-radius: var(--r-md); font-size: 14.5px; transition: opacity .2s; }
.lg li:hover { background: var(--hover); }
.lg-v { font-weight: 600; font-variant-numeric: tabular-nums; }
.lg-p { color: var(--ink-3); font-size: 13px; text-align: end; font-variant-numeric: tabular-nums; }
table.tb { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.tb th { text-align: start; font-weight: 500; color: var(--ink-3); font-size: 13px; padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
.tb td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; overflow-wrap: anywhere; }
.tb tr:last-child td { border-bottom: 0; }
.tb .n { text-align: end; font-weight: 600; white-space: nowrap; }
.tb .c { display: inline-flex; align-items: center; gap: 8px; }
.tb .s { color: var(--ink-3); font-size: 13px; }
.tb tbody tr[data-r] { cursor: pointer; }
.tb tbody tr:hover td { background: var(--hover); }
.more-n { margin: 10px 0 0; font-size: 13.5px; color: var(--ink-3); }

/* sources: the file lines behind a block */
.src { margin: auto -20px -20px; padding-top: 0; border-top: 1px solid var(--line); }
.card { display: flex; flex-direction: column; } .card > .plot { margin-bottom: 16px; } .card > .plot:last-child { margin-bottom: 0; }
.src > button { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 13px 20px; font-size: 13.5px; color: var(--ink-2); text-align: start; border-radius: 0 0 var(--r-xl) var(--r-xl); }
.src > button:hover { color: var(--ink); background: var(--hover); }
.src > button .i { width: 16px; height: 16px; }
.src > button .chev { margin-inline-start: auto; }
.src-in { padding: 0 20px 18px; }
.src-f { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; font-size: 13.5px; color: var(--ink-2); }
.src-f button { border: 1px solid var(--line-2); background: none; border-radius: 999px; padding: 3px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.src-f .i { width: 14px; height: 14px; }
.tx { list-style: none; margin: 0; padding: 0; }
.tx li { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: center; }
.tx li:last-child { border-bottom: 0; }
.tx .d { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
.tx .m { min-width: 0; }
.tx .m b { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.tx .m b span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .m small { display: block; color: var(--ink-3); font: 400 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .a { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: end; }
.tx .a.in { color: var(--ok); }
.tx-more { margin: 10px 0 0; }

/* report specials */
.read { margin: 20px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); }
.read > button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 16px 20px; text-align: start; border-radius: var(--r-xl); }
.read > button:hover { background: var(--hover); }
.read > button .chev { margin-inline-start: auto; color: var(--ink-3); }
.read > button b { font-weight: 600; }
.read > button span { color: var(--ink-2); font-size: 14px; }
.read .ok { color: var(--ok); white-space: nowrap; }
.read-in { padding: 0 20px 20px; display: grid; gap: 14px; }
.fl { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; }
.fl h4 { margin: 0; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.fl h4 .i { width: 16px; height: 16px; color: var(--ink-3); }
.fl p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
.fl .btn, .read-in .btn { white-space: normal; height: auto; min-height: 34px; padding-top: 6px; padding-bottom: 6px; text-align: start; max-width: 100%; }
.cols { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
.cols li { font-size: 13px; background: var(--surface-2); border-radius: var(--r-sm); padding: 3px 8px; color: var(--ink-2); }
.cols li b { color: var(--ink); font-weight: 500; }
.how-c { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.read-in { grid-template-columns: minmax(0, 1fr); } .fl, .how-c div, .read > button div { min-width: 0; overflow-wrap: anywhere; }
.how-c div { background: var(--surface-2); border-radius: var(--r-lg); padding: 12px 14px; }
.how-c b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.how-c small { color: var(--ink-2); font-size: 13px; }
.how-c .warn b { color: var(--warn); }
.ins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0 0; }
.in-c { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 20px; animation: rise 600ms var(--open) both; }
.in-c .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); margin-bottom: 14px; }
.in-c .ic .i { width: 18px; height: 18px; }
.in-c h3 { font-size: 15.5px; font-weight: 600; }
.in-c p { margin: 6px 0 0; color: var(--ink-2); font-size: 14.5px; }
.in-c .v { font: 600 24px/1.2 var(--sans); color: var(--ink); margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.odd { list-style: none; margin: 0; padding: 0; }
.odd li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.odd li:last-child { border-bottom: 0; }
.odd b { font-weight: 600; }
.odd small { grid-column: 1 / -1; color: var(--ink-2); font-size: 13.5px; }
.odd .a { font-weight: 600; font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 1px 8px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }

/* all transactions */
.tools-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0 0; }
.search { position: relative; flex: 1 1 260px; }
.search .i { position: absolute; inset-inline-start: 12px; top: 11px; width: 17px; height: 17px; color: var(--ink-3); }
.search input { width: 100%; height: 40px; border-radius: var(--r-lg); border: 1px solid var(--line-2); background: var(--surface); padding: 0 12px 0 38px; outline: 0; }
.search input:focus { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.alltx { margin: 12px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 4px 20px; }
.alltx table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.alltx td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.alltx tr:last-child td { border-bottom: 0; }
.alltx .d { color: var(--ink-3); font-size: 13px; white-space: nowrap; width: 70px; font-variant-numeric: tabular-nums; }
.alltx .l b { font-weight: 500; display: block; }
.alltx .l small { color: var(--ink-3); font: 400 12px var(--mono); display: block; word-break: break-all; }
.alltx .a { text-align: end; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; width: 110px; }
.alltx .a.in { color: var(--ok); }
.catb { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 8px 3px 10px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.catb:hover, .catb[aria-expanded="true"] { border-color: var(--line-2); color: var(--ink); }
.catb .i { width: 14px; height: 14px; }
.catb.todo { border-color: color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn); }
.catb small { font-size: 11px; color: var(--ink-3); }
.alltx .menu { max-height: none; }
.alltx .menu .apply { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 10px; font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.empty { color: var(--ink-3); padding: 20px 0; text-align: center; }

.saved { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 10px; }
.saved li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 16px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.saved li > div { flex: 1 1 280px; min-width: 0; }
.saved b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved small { color: var(--ink-3); font-size: 13.5px; }
.saved .none { color: var(--ink-2); justify-content: center; padding: 32px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--tip); color: var(--tip-ink); border-radius: var(--r-lg); padding: 6px 6px 6px 16px; display: flex; gap: 12px; align-items: center; font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .3s var(--open), transform .3s var(--open); z-index: 60; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { border: 0; background: var(--accent); color: var(--on-accent); border-radius: var(--r-md); padding: 6px 12px; font-weight: 600; }
.foot { width: 100%; max-width: 1200px; margin: 72px auto 0; padding: 20px 24px 32px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink-3); display: flex; gap: 12px 24px; flex-wrap: wrap; justify-content: space-between; }
.main .foot { margin: 72px 0 0; padding: 20px 0 0; max-width: none; }
.main > .foot { margin-top: auto; }
.main > *:has(+ .foot) { margin-bottom: 72px; }

/* report: main column + the file on the right (wide screens) */
.rep { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; margin: 8px 0 0; }
.rep-main { min-width: 0; container-type: inline-size; container-name: repm; }
@container repm (max-width: 860px) { .card.kpi { grid-column: span 6 !important; } }
@container repm (max-width: 420px) { .card.kpi { grid-column: span 12 !important; } }
.how-c { grid-template-columns: repeat(auto-fit, minmax(min(130px, 100%), 1fr)) !important; }
.rep-side { display: grid; gap: 12px; min-width: 0; }
.rep-side .read { margin: 0; }
.sect.first { margin-top: 24px; }
.pv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 16px; display: grid; gap: 10px; }
.pv h3 { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; min-width: 0; margin: 0; }
.pv h3 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv h3 .i { width: 16px; height: 16px; color: var(--ink-3); }
.pv .per { margin: -6px 0 0; }
.pv-doc { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.pv-doc table { width: 100%; border-collapse: collapse; table-layout: fixed; font: 400 11.5px/1.3 var(--mono); }
.pv-doc th { width: 30px; text-align: end; color: var(--ink-2); font-weight: 400; background: var(--surface-2); padding: 6px 6px; border-inline-end: 1px solid var(--line); }
.pv-doc td { padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.pv-doc td:first-of-type { width: 74px; }
.pv-doc .pa { width: 70px; text-align: end; color: var(--ink); }
.pv-doc .pa.in { color: var(--ok); }
.pv-doc tr:last-child td, .pv-doc tr:last-child th { border-bottom: 0; }
.pv .btn { justify-self: start; }

/* filters: one sticky row above the analysis */
.fwrap { position: sticky; top: 61px; z-index: 20; margin: 0; padding: 8px 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: var(--r-xl); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
